<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlueBoxx DA — Learn, Intern, Get Placed</title>
    <meta name="description" content="BlueBoxx is an end-to-end career ecosystem. Master in-demand skills, build real projects, get guaranteed internships, and land your dream job." />
    <meta name="theme-color" content="#2563EB" />

    <!-- Theme Initialization -->
    <script>
      (function() {
        const t = localStorage.getItem('bb-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          // If you want default light, we can remove the dark mode class entirely
          // or just respect local storage.
          // For now, let's explicitly remove dark if we want it to be default light.
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
